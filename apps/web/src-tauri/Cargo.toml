[package]
name = "app"
version = "1.0.0"
description = "Atomic — tiny habits, remarkable results"
authors = ["andeen"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# Keep `tauri` on the same minor as the `@tauri-apps/api` npm package (pulled in
# by `@tauri-apps/plugin-opener`), and each plugin on its npm package's minor:
# the Tauri CLI refuses mismatched pairs.
tauri = { version = "2.12", features = [] }
tauri-plugin-log = "2.0.0-rc"
# Opens checkout, billing and account-export links in the default browser (`lib/open-external.ts`).
tauri-plugin-opener = "2.7"
